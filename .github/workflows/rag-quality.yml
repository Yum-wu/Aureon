name: RAG Quality Gate

on:
  pull_request:
    paths:
      - 'backend/app/rag/**'
      - 'backend/tests/test_rag_quality.py'
      - 'backend/tests/test_data_golden.py'
      - 'backend/tests/deepeval_eval.py'
  workflow_dispatch:
    inputs:
      dataset:
        description: 'Dataset to evaluate'
        required: false
        default: 'core_regression_27qa'

jobs:
  rag-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          cd backend
          pip install -r requirements.txt
          pip install deepeval

      - name: Run RAG Quality Gate
        env:
          SKIP_LOCAL_EMBED: "true"
          DASHSCOPE_API_KEY: ${{ secrets.DASHSCOPE_API_KEY }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_BASE_URL: "https://api.deepseek.com"
          LLM_MODEL: "deepseek-v4-flash"
        run: |
          cd backend
          python -m pytest tests/test_rag_quality.py -v --timeout=300

      - name: Run Full Evaluation (on main)
        if: github.ref == 'refs/heads/main'
        env:
          SKIP_LOCAL_EMBED: "true"
          DASHSCOPE_API_KEY: ${{ secrets.DASHSCOPE_API_KEY }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_BASE_URL: "https://api.deepseek.com"
          LLM_MODEL: "deepseek-v4-flash"
        run: |
          cd backend
          python -m tests.eval_runner golden_97qa --no-db
