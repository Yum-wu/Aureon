name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies
        run: npm audit --audit-level=high --production

      - name: Run lint
        run: npm run lint

      - name: Run tests
        run: npm test -- --reporter=basic

      - name: Build
        run: npm run build

  test-backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: aureon_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d aureon_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/aureon_test
      DATABASE__DATABASE_URL: postgresql://postgres:postgres@localhost:5432/aureon_test
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: 'backend/requirements.txt'

      - name: Install dependencies
        run: |
          cd backend
          pip install -r requirements.txt
          pip install -r requirements-dev.txt ruff pip-audit mypy
          pip install --force-reinstall "langchain>=1.3,<1.4" "langchain-core>=0.3" "langchain-openai>=1.2" "langchain-community>=0.3" "langchain-text-splitters>=1.1"
          pip install email-validator

      - name: Lint backend code
        run: |
          cd backend
          ruff check app/

      - name: Initialize test database schema
        run: |
          cd backend
          PYTHONPATH=. python - <<'PY'
          import asyncio
          from app.database import close_db_pool, init_db
          from app.memory.storage import get_backend, reset_backend

          async def main():
              get_backend().init()
              await init_db()
              await close_db_pool()
              reset_backend()

          asyncio.run(main())
          PY

      - name: Run tests
        run: |
          cd backend
          PYTHONPATH=. pytest tests/ -v --timeout=60 --ignore=tests/test_railway_http.py --ignore=tests/benchmark_enterprise.py --ignore=tests/run_full_benchmark.py -m "not integration and not benchmark and not quality and not smoke" --cov=app --cov-report=term-missing --cov-report=xml

      - name: Dependency audit (pip-audit)
        run: |
          cd backend
          pip-audit -r requirements.txt --strict
        continue-on-error: true  # 漏洞修复需要兼容性评估（starlette/FastAPI 版本耦合）

      - name: Type check (mypy)
        run: |
          cd backend
          mypy app/ --ignore-missing-imports --no-error-summary
        continue-on-error: true  # Gradual enablement

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/coverage.xml
