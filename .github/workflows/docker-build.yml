name: Docker Build

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'Dockerfile'
      - 'docker-compose.yml'
      - 'backend/requirements.txt'
      - 'frontend.Dockerfile'
      - 'docker-entrypoint.sh'
      - 'nginx.conf'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/docker-build.yml'
  push:
    branches: [main]
    paths:
      - 'Dockerfile'
      - 'docker-compose.yml'
      - 'backend/requirements.txt'
      - 'frontend.Dockerfile'
      - 'docker-entrypoint.sh'
      - 'nginx.conf'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/docker-build.yml'

permissions:
  security-events: write
  contents: read

jobs:
  validate:
    name: Validate Docker Configuration
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - name: Validate docker-compose.yml
        env:
          ES_PASSWORD: ci_validation_only
          REDIS_PASSWORD: ci_validation_only
          QDRANT_API_KEY: ci_validation_only
        run: |
          # Create dummy .env if missing (excluded from repo via .gitignore)
          test -f backend/.env || touch backend/.env
          docker compose config --quiet

      - name: Lint Dockerfile
        uses: hadolint/hadolint-action@v3.4.0
        with:
          dockerfile: Dockerfile
          failure-threshold: warning

  build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: validate
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: false
          load: true
          tags: aureon:ci-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trivy image scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: 'aureon:ci-${{ github.sha }}'
          format: 'sarif'
          output: 'trivy-results.sarif'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'
        continue-on-error: true

      - name: Upload Trivy scan results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'
