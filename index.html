    {
      "@context": "https://schema.org",

    <!-- Critical fonts: display + body (essential weights only) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link id="critical-fonts" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
    <!-- Non-critical fonts: extra weights + monospace (async, non-blocking) -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;800&family=Inter:wght@700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" media="print" onload="this.media='all'" />
    <noscript><link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;800&family=Inter:wght@700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" /></noscript>
    <!-- Font loading timeout: fallback to system fonts if CDN blocked -->
    <script>
      (function() {
        var timeout = setTimeout(function() {
          var link = document.getElementById('critical-fonts');
          if (link) link.remove();
          document.documentElement.style.setProperty('--font-display', "'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif");
          document.documentElement.style.setProperty('--font-body', "'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif");
        }, 5000);
        if (document.fonts && document.fonts.ready) {
          document.fonts.ready.then(function() { clearTimeout(timeout); });
        }
      })();
    </script>

  </body>
