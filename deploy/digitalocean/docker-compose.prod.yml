services:
  backend:
    build:
      context: ../..
      dockerfile: backend/Dockerfile
      args:
        SERVER_MODE: gunicorn
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      - REDIS_URL=redis://:${REDIS_PASSWORD:?REDIS_PASSWORD is required}@redis:6379
      - WEBSOCKET_MAX_CONNECTIONS=300
      - RAG_SEMAPHORE=40
      - LLM_SEMAPHORE_DEEPSEEK=30
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - aureon-data:/app/data
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: "2.0"

  redis:
    image: redis/redis-stack-server:latest
    command: redis-server --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.5"

volumes:
  aureon-data:
  redis-data:
