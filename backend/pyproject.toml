[project]
name = "aureon-backend"
version = "1.0.0"
requires-python = ">=3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-v --tb=short -m 'not integration and not benchmark and not quality and not smoke'"
markers = [
    "integration: 集成测试，需外部服务（Qdrant/LLM API），默认跳过",
    "benchmark: 检索性能基准测试",
    "quality: DeepEval 质量门禁测试",
    "smoke: 生产环境冒烟测试",
]
# Parallel execution: use -n auto flag
# Example: pytest -n auto tests/

[tool.pytest-xdist]
# Worker isolation settings

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = ["E402", "W293"]

[tool.ruff.lint.per-file-ignores]
"app/benchmark/__init__.py" = ["F401"]
"app/evaluation/__init__.py" = ["F401"]
"app/features/__init__.py" = ["F401"]
"app/observability/__init__.py" = ["F401"]
"app/rag/__init__.py" = ["F401"]
"app/rag/qa_chain.py" = ["F821"]
"app/reliability/__init__.py" = ["F401"]

[tool.coverage.run]
source = ["app"]
branch = true
omit = ["tests/*", "*/__pycache__/*"]

[tool.coverage.report]
show_missing = true
fail_under = 50

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
no_error_summary = false
warn_return_any = false
warn_unused_configs = true
# Gradual enablement: start permissive, tighten over time
disable_error_code = ["misc", "assignment", "attr-defined"]
