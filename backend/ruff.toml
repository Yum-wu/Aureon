# Ruff configuration for Aureon backend
# CI runs: ruff check app/ --select E,F,W --ignore E501,E402,W293

[lint]
select = ["E", "F", "W"]
ignore = ["E501", "E402", "W293"]

[lint.per-file-ignores]
# benchmark __init__: try/except optional imports + __all__.append()
"app/benchmark/__init__.py" = ["F401"]
# evaluation __init__: re-export
"app/evaluation/__init__.py" = ["F401"]
# features __init__: optional sqlite3 import + lazy get_db
"app/features/__init__.py" = ["F401"]
# observability __init__: lazy imports
"app/observability/__init__.py" = ["F401"]
# rag __init__: re-export for public API
"app/rag/__init__.py" = ["F401"]
# rag qa_chain: get_reranking_strategy defined dynamically
"app/rag/qa_chain.py" = ["F821"]
# reliability __init__: re-export
"app/reliability/__init__.py" = ["F401"]
