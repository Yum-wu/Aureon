  # ═══════════════════════════════════════════════════════════════
  # Hard 难度：跨文档综合题（30 题）
  # ═══════════════════════════════════════════════════════════════

  - question: "比较 HyDE 和 Multi-Query 两种检索策略的原理、适用场景和优缺点"
    expected_answer: "HyDE 通过 LLM 生成假设文档再检索，适合查询模糊需要语义扩展的场景，优势是能将模糊查询映射到更接近真实文档的语义空间，劣势是假设文档可能误导检索方向且增加 LLM 调用成本；Multi-Query 生成多个查询变体从不同角度检索，适合需要多角度理解的场景，优势是覆盖面广不易遗漏，劣势是多个查询增加检索开销且结果融合需要额外处理"
    source_article: "A-01-hyde-principles-and-practice"
    difficulty: "hard"
    is_negative: false

  - question: "从 BM25 到稀疏向量再到 BGE-M3 的 dense+sparse 联合检索，关键词检索技术经历了怎样的演进？各自的优劣是什么？"
    expected_answer: "BM25 是纯统计方法，无需训练开箱即用但无法处理同义词和语义等价；稀疏向量通过神经网络学习词项权重解决了同义词问题但仍是词袋模型；BGE-M3 的 dense+sparse 联合检索结合了稠密向量的语义理解能力和稀疏向量的精确匹配能力，通过 RRF 融合实现最佳效果，但计算成本更高"
    source_article: "A-03-bm25-vs-sparse-vector-evolution"
    difficulty: "hard"
    is_negative: false

  - question: "Bi-Encoder、Cross-Encoder 和 Late Interaction（ColBERT）三种编码架构在精度、速度和适用场景上如何权衡？"
    expected_answer: "Bi-Encoder 独立编码速度快支持预计算和 ANN 检索但精度有限；Cross-Encoder 联合编码精度最高但无法预计算速度慢适合 Rerank；Late Interaction 保留 Token 级别交互在精度和速度间取得平衡，支持预计算文档向量但检索时需 MaxSim 计算。生产中通常 Bi-Encoder 召回+Cross-Encoder/Late Interaction 精排"
    source_article: "A-08-cross-encoder-vs-bi-encoder"
    difficulty: "hard"
    is_negative: false

  - question: "CRAG 和 Self-RAG 都是对传统 RAG 的改进，它们的纠正机制有什么本质区别？"
    expected_answer: "CRAG 在生成前评估检索质量执行三路动作（correct/ambiguous/incorrect），是外部评估模块驱动的纠正；Self-RAG 让模型自身通过反思 Token 自主决定何时检索、评估检索相关性和生成支持度，是模型内化的自我纠正。CRAG 更容易集成到现有系统，Self-RAG 需要专门训练但更灵活"
    source_article: "C-01-corrective-rag-implementation"
