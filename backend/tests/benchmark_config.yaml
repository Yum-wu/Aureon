# benchmark_config.yaml — 企业级 RAG 基准测试配置
# QA 数据集、性能阈值、端点配置
# 数据集统计：372 QA pairs，覆盖 99 篇文章
# 分布：simple 225 (63.9%) | medium 97 (27.6%) | hard 30 (8.5%) | negative 20

qa_dataset:
  # ═══════════════════════════════════════════════════════════════
  # A 组：检索策略（A-01 ~ A-12）
  # ═══════════════════════════════════════════════════════════════

  # A-01 HyDE 原理与实践
  - question: "HyDE 的全称是什么？"
    expected_answer: "HyDE 全称 Hypothetical Document Embeddings，即假设性文档嵌入"
    source_article: "A-01-hyde-principles-and-practice"
    difficulty: "simple"
    is_negative: false
  - question: "HyDE 的检索流程与传统检索流程有什么不同？"
    expected_answer: "传统流程是 Query→Embedding→检索，HyDE 流程是 Query→LLM 生成假设文档→假设文档 Embedding→检索真实文档"
    source_article: "A-01-hyde-principles-and-practice"
    difficulty: "simple"
    is_negative: false
  - question: "为什么 HyDE 即使假设文档包含事实错误仍然有效？"
    expected_answer: "因为即使假设文档包含事实错误，其语言模式和词汇分布仍然与真实相关文档高度相似，假设文档的嵌入向量比原始查询更接近目标文档"
    source_article: "A-01-hyde-principles-and-practice"
    difficulty: "medium"
    is_negative: false

  # A-02 Multi-Query 检索策略对比
  - question: "Multi-Query 检索的核心思想是什么？"
    expected_answer: "将用户原始查询改写为多个不同角度的子查询，分别检索后合并结果，从而提高召回率和覆盖度"
    source_article: "A-02-multi-query-retrieval-comparison"
    difficulty: "simple"
    is_negative: false
  - question: "Multi-Query 和 HyDE 的主要区别是什么？"
    expected_answer: "HyDE 生成假设性答案文档再检索，Multi-Query 生成多个查询变体从不同角度检索。HyDE 产出的是文档，Multi-Query 产出的是查询"
    source_article: "A-02-multi-query-retrieval-comparison"
    difficulty: "medium"
    is_negative: false
  - question: "Step-Back Prompting 策略的原理是什么？"
    expected_answer: "让 LLM 从更高层次抽象原始查询，生成更宽泛的后退查询，关注背后的概念和原理而非具体细节，从而检索到更全面的背景知识"
    source_article: "A-02-multi-query-retrieval-comparison"
    difficulty: "simple"
    is_negative: false

  # A-03 BM25 vs 稀疏向量
  - question: "BM25 算法中参数 k1 和 b 分别控制什么？"
    expected_answer: "k1 控制词频饱和程度，通常取 1.2-2.0；b 控制文档长度归一化，通常取 0.75"
    source_article: "A-03-bm25-vs-sparse-vector-evolution"
    difficulty: "simple"
    is_negative: false
  - question: "BM25 的主要局限性有哪些？"
    expected_answer: "词汇鸿沟（无法处理同义词）、分词依赖（中文需 jieba 等分词器）、无语义理解、固定权重（IDF 无法针对特定查询调整）"
    source_article: "A-03-bm25-vs-sparse-vector-evolution"
    difficulty: "simple"
    is_negative: false
  - question: "稀疏向量相比 BM25 的核心优势是什么？为什么？"
    expected_answer: "稀疏向量是学习型关键词检索，能通过神经网络学习词项权重，解决同义词问题，且无需分词器。BM25 是纯统计方法，无法理解语义等价关系"
    source_article: "A-03-bm25-vs-sparse-vector-evolution"
    difficulty: "medium"
    is_negative: false

  # A-04 查询扩展技术
  - question: "查询扩展技术要解决用户查询的哪三个核心问题？"
    expected_answer: "表述模糊、词汇不匹配、信息需求表达不完整"
    source_article: "A-04-query-expansion-techniques"
    difficulty: "simple"
    is_negative: false
  - question: "伪相关反馈（PRF）的基本假设是什么？"
    expected_answer: "初次检索返回的前 k 个文档虽然不完全相关，但包含与查询相关的扩展词"
    source_article: "A-04-query-expansion-techniques"
    difficulty: "simple"
    is_negative: false
  - question: "Rocchio 算法中 α、β、γ 三个参数分别控制什么？"
    expected_answer: "α 控制原始查询权重，β 控制相关文档权重，γ 控制不相关文档权重。通过调整三者平衡来优化查询向量"
    source_article: "A-04-query-expansion-techniques"
    difficulty: "medium"
    is_negative: false

  # A-05 RRF 融合
  - question: "RRF 的全称是什么？由谁在什么时候提出？"
    expected_answer: "Reciprocal Rank Fusion，由 Cormack、Clarke 和 Büttcher 于 2009 年提出"
    source_article: "A-05-reciprocal-rank-fusion-deep-dive"
    difficulty: "simple"
    is_negative: false
  - question: "RRF 公式中参数 k 的默认值是多少？它控制什么？"
    expected_answer: "默认值为 60。k 值控制排名靠前文档的优势程度，k 越小排名靠前的文档优势越大"
    source_article: "A-05-reciprocal-rank-fusion-deep-dive"
    difficulty: "simple"
    is_negative: false
  - question: "为什么 RRF 基于排名而非原始分数进行融合？"
    expected_answer: "不同检索方法的分数尺度不同（如余弦相似度 vs BM25 分数），RRF 基于排名天然归一化，避免分数尺度不一致的问题，同时通过长尾抑制和共识增强提升融合效果"
    source_article: "A-05-reciprocal-rank-fusion-deep-dive"
    difficulty: "medium"
    is_negative: false

  # A-06 Late Interaction / ColBERT
  - question: "ColBERT 的核心创新是什么？"
    expected_answer: "保留 Token 级别嵌入而非压缩为单一向量，使用延迟交互在检索时计算查询和文档 Token 间的交互，通过 MaxSim 操作计算相关性分数"
    source_article: "A-06-late-interaction-models-colbert"
    difficulty: "simple"
    is_negative: false
  - question: "MaxSim 机制的计算方式是什么？"
    expected_answer: "对于查询 Q 中每个 Token q，找到文档 D 中与之最相似的 Token d 取最大相似度，然后对所有查询 Token 求和"
    source_article: "A-06-late-interaction-models-colbert"
    difficulty: "simple"
    is_negative: false
  - question: "Late Interaction 模型如何在 Bi-Encoder 和 Cross-Encoder 之间取得平衡？"
    expected_answer: "Bi-Encoder 独立编码速度快但精度有限，Cross-Encoder 联合编码精度高但速度慢。Late Interaction 保留 Token 级别细粒度交互同时支持预计算和高效检索，在精度和速度间取得平衡"
    source_article: "A-06-late-interaction-models-colbert"
    difficulty: "medium"
    is_negative: false

  # A-07 RAG 概述
  - question: "RAG 由谁在什么时候提出？"
    expected_answer: "由 Lewis 等人在 2020 年提出"
    source_article: "A-07-retrieval-augmented-generation-overview"
    difficulty: "simple"
    is_negative: false
  - question: "朴素 RAG 的基本流程是什么？"
    expected_answer: "用户查询→Embedding→向量检索→Top-K 文档→拼接 Prompt→LLM 生成"
    source_article: "A-07-retrieval-augmented-generation-overview"
    difficulty: "simple"
    is_negative: false
  - question: "高级 RAG 相比朴素 RAG 增加了哪些环节？"
    expected_answer: "增加了查询理解与改写、多路检索与融合、检索结果评估与重排、自我纠正与迭代、答案验证与引用等环节，形成更完整的 Pipeline"
    source_article: "A-07-retrieval-augmented-generation-overview"
    difficulty: "medium"
    is_negative: false

  # A-08 Cross-Encoder vs Bi-Encoder
  - question: "Bi-Encoder 的核心特性有哪些？"
    expected_answer: "独立编码、预计算（文档向量可离线预计算并索引）、ANN 检索（支持 HNSW/IVF 等近似最近邻算法）、无交互（查询和文档 Token 间没有交叉注意力）"
    source_article: "A-08-cross-encoder-vs-bi-encoder"
    difficulty: "simple"
    is_negative: false
  - question: "Cross-Encoder 为什么精度高但速度慢？"
    expected_answer: "Cross-Encoder 将查询和文档拼接后联合编码，通过交叉注意力实现 Token 级别深度交互，因此精度高。但无法预计算文档向量，每次查询都需要与所有文档联合编码，所以速度慢"
    source_article: "A-08-cross-encoder-vs-bi-encoder"
    difficulty: "medium"
    is_negative: false

  # A-09 MMR 多样性检索
  - question: "MMR 的全称是什么？由谁在什么时候提出？"
    expected_answer: "Maximal Marginal Relevance，由 Carbonell 和 Goldstein 于 1998 年提出"
    source_article: "A-09-maximal-marginal-relevance"
    difficulty: "simple"
    is_negative: false
  - question: "MMR 算法中参数 λ 取值 0.7-0.8 时是什么效果？"
    expected_answer: "偏相关性，适度去重，保留最相关结果。λ=1.0 退化为标准排序，λ=0.5 为平衡模式"
    source_article: "A-09-maximal-marginal-relevance"
    difficulty: "simple"
    is_negative: false
  - question: "MMR 如何解决传统检索的信息冗余问题？"
    expected_answer: "传统检索按相关性排序返回结果，排名靠前的文档内容高度相似。MMR 采用贪心策略，每次选择使相关性最大化和与已选文档相似度最小化的文档，在相关性和多样性间取得平衡"
    source_article: "A-09-maximal-marginal-relevance"
    difficulty: "medium"
    is_negative: false

  # A-10 检索反馈闭环
  - question: "检索反馈闭环中显式信号有哪些？"
    expected_answer: "点赞/点踩、投票、纠错、收藏"
    source_article: "A-10-retrieval-feedback-loops"
    difficulty: "simple"
    is_negative: false
  - question: "隐式信号中哪些是正面信号，哪些是负面信号？"
    expected_answer: "正面信号包括停留时间长、复制行为、追问；负面信号包括请求重新生成、跳出、用户自行改写查询重新搜索"
    source_article: "A-10-retrieval-feedback-loops"
    difficulty: "medium"
    is_negative: false

  # A-11 语义搜索基础
  - question: "语义搜索经历了哪三个主要阶段？"
    expected_answer: "统计方法（TF-IDF/BM25）、学习排序（LTR）、基于深度学习的稠密检索"
    source_article: "A-11-semantic-search-fundamentals"
    difficulty: "simple"
    is_negative: false
  - question: "TF-IDF 的主要局限性是什么？"
    expected_answer: "无语义理解（无法区分一词多义）、词序无关、稀疏表示（向量大部分为 0）、同义词问题（无法处理等价关系）"
    source_article: "A-11-semantic-search-fundamentals"
    difficulty: "simple"
    is_negative: false
  - question: "从 TF-IDF 到稠密检索的演进解决了哪些核心问题？"
    expected_answer: "解决了语义理解问题（一词多义、同义词）、词序信息丢失问题、稀疏表示效率问题。稠密检索通过神经网络将文本编码为低维稠密向量，语义相似的文本在向量空间中距离相近"
    source_article: "A-11-semantic-search-fundamentals"
    difficulty: "medium"
    is_negative: false

  # A-12 联邦检索
  - question: "联邦检索的四个核心组件是什么？"
    expected_answer: "查询路由器、适配器层、结果归一化、融合排序"
    source_article: "A-12-federated-search-multi-source"
    difficulty: "simple"
    is_negative: false
  - question: "联邦检索面临的核心挑战是什么？"
    expected_answer: "如何统一不同数据源的检索接口、排序标准和结果格式，提供一致的用户体验"
    source_article: "A-12-federated-search-multi-source"
    difficulty: "simple"
    is_negative: false
  - question: "联邦检索中适配器模式的设计目的是什么？"
    expected_answer: "统一不同数据源的检索接口，将不同格式的结果统一为标准格式，使上层逻辑无需关心底层数据源的差异性"
    source_article: "A-12-federated-search-multi-source"
    difficulty: "medium"
    is_negative: false

  # ═══════════════════════════════════════════════════════════════
  # B 组：Embedding 与向量索引（B-01 ~ B-10）
  # ═══════════════════════════════════════════════════════════════

  # B-01 Embedding 模型选型
  - question: "C-MTEB 中文检索排行榜上排名第一的模型是什么？"
    expected_answer: "bge-large-zh-v1.5，检索平均分 70.5"
    source_article: "B-01-embedding-model-selection-guide"
    difficulty: "simple"
    is_negative: false
  - question: "选择 Embedding 模型需要综合考虑哪些因素？"
    expected_answer: "检索精度、推理延迟、成本、多语言支持、部署方式"
    source_article: "B-01-embedding-model-selection-guide"
    difficulty: "simple"
    is_negative: false
  - question: "在中文检索场景下，为什么 bge-large-zh-v1.5 比 OpenAI text-embedding-3-large 更受欢迎？"
    expected_answer: "bge-large-zh-v1.5 在 C-MTEB 中文检索排行榜上得分更高（70.5 vs 67.5），支持本地部署免费使用，且专为中文优化；OpenAI 模型需要 API 调用产生成本，且中文效果不如专门优化的模型"
    source_article: "B-01-embedding-model-selection-guide"
    difficulty: "medium"
    is_negative: false

  # B-02 向量量化
  - question: "FP32 转 INT8 量化可以实现多少倍压缩？"
    expected_answer: "4 倍压缩"
    source_article: "B-02-vector-quantization-int8-fp16"
    difficulty: "simple"
    is_negative: false
  - question: "标量量化和乘积量化的主要区别是什么？"
    expected_answer: "标量量化将每个浮点数量化为低位整数（如 FP32→INT8），乘积量化将向量分成多个子空间每个子空间独立量化，乘积量化压缩率更高且能保持更好的检索精度"
    source_article: "B-02-vector-quantization-int8-fp16"
    difficulty: "medium"
    is_negative: false

  # B-03 Matryoshka 嵌入
  - question: "Matryoshka Representation Learning 的核心思想是什么？"
    expected_answer: "训练嵌入模型使其前 N 维就是一个有效的低维表示，无需重新训练或蒸馏即可灵活选择维度"
    source_article: "B-03-matryoshka-embeddings"
    difficulty: "simple"
    is_negative: false
  - question: "Matryoshka 嵌入与传统嵌入在截断操作上有什么区别？"
    expected_answer: "传统嵌入截断前 256 维会严重损失精度，Matryoshka 嵌入截断是安全的，前 256 维约等于 256 维模型的精度"
    source_article: "B-03-matryoshka-embeddings"
    difficulty: "simple"
    is_negative: false
  - question: "Matryoshka 嵌入如何在训练中实现多粒度表示？"
    expected_answer: "在多个粒度上同时计算损失，对前 256 维、前 512 维、前 1024 维等分别计算损失并加权求和，使模型在所有粒度上都学到有效表示"
    source_article: "B-03-matryoshka-embeddings"
    difficulty: "medium"
    is_negative: false

  # B-04 领域微调
  - question: "通用 Embedding 模型在特定领域可能存在哪些不足？"
    expected_answer: "术语不匹配、语义偏差、细粒度区分不足、领域知识缺失"
    source_article: "B-04-domain-specific-fine-tuning"
    difficulty: "simple"
    is_negative: false
  - question: "金融领域中'牛市'一词如何体现通用 Embedding 的语义偏差问题？"
    expected_answer: "金融领域的'牛市'指市场上涨，日常语境中指动物，通用模型可能混淆这两种完全不同的含义"
    source_article: "B-04-domain-specific-fine-tuning"
    difficulty: "medium"
    is_negative: false

  # B-05 多语言 Embedding
  - question: "多语言 Embedding 面临的五个核心挑战是什么？"
    expected_answer: "语言不对称、词序差异、分词差异、文化差异、低资源语言"
    source_article: "B-05-multilingual-embedding-challenges"
    difficulty: "simple"
    is_negative: false
  - question: "bge-m3 和 bge-large-zh 在跨语言检索能力上有什么区别？"
    expected_answer: "bge-m3 支持 100+ 语言且跨语言检索优秀，bge-large-zh 仅支持中文不支持跨语言检索但在中文单语场景效果最优"
    source_article: "B-05-multilingual-embedding-challenges"
    difficulty: "medium"
    is_negative: false

  # B-06 Embedding 降维
  - question: "Embedding 降维的主要动机是什么？"
    expected_answer: "降低存储成本和检索速度。1024 维向量每个文档占 4KB，百万级文档需约 4GB，降维可在保留大部分语义信息前提下显著降低存储和计算成本"
    source_article: "B-06-embedding-dimension-reduction"
    difficulty: "simple"
    is_negative: false
  - question: "PCA 降维和 Matryoshka 降维的本质区别是什么？"
    expected_answer: "PCA 是后处理的线性降维方法，通过正交变换投影到方差最大方向；Matryoshka 是训练时多粒度优化，前 N 维本身就是有效表示。Matryoshka 降维后精度损失更小"
    source_article: "B-06-embedding-dimension-reduction"
    difficulty: "medium"
    is_negative: false

  # B-07 BGE-M3 架构
  - question: "BGE-M3 中 M3 代表什么？"
    expected_answer: "Multi-lingual（多语言）、Multi-function（多功能）、Multi-granularity（多粒度）"
    source_article: "B-07-bge-m3-architecture-analysis"
    difficulty: "simple"
    is_negative: false
  - question: "BGE-M3 一次推理可以同时生成哪三种向量？"
    expected_answer: "dense 向量（[CLS]+Mean Pooling→1024 维）、sparse 向量（Linear+ReLU+Log→词项权重）、ColBERT 向量（Linear Projection→Token 级别 1024 维向量）"
    source_article: "B-07-bge-m3-architecture-analysis"
    difficulty: "simple"
    is_negative: false
  - question: "BGE-M3 的三合一输出为什么比分别使用三个模型更高效？"
    expected_answer: "一次推理同时生成三种向量，共享 XLM-RoBERTa Encoder 的计算，避免三次独立推理的开销，显著降低延迟和成本"
    source_article: "B-07-bge-m3-architecture-analysis"
    difficulty: "medium"
    is_negative: false

  # B-08 Embedding API 性能对比
  - question: "DashScope Embedding API 的 P50 延迟是多少？"
    expected_answer: "80ms"
    source_article: "B-08-embedding-api-benchmark"
    difficulty: "simple"
    is_negative: false
  - question: "在中文场景下，哪个 Embedding API 的延迟最低？"
    expected_answer: "DashScope text-embedding-v3，P50 延迟 80ms，吞吐 100/s，中文效果优秀"
    source_article: "B-08-embedding-api-benchmark"
    difficulty: "medium"
    is_negative: false

  # B-09 向量索引算法
  - question: "HNSW 算法的全称是什么？它的核心结构是什么？"
    expected_answer: "Hierarchical Navigable Small World，核心是多层图结构，类似跳表，上层稀疏下层稠密，通过贪心搜索和逐层下降实现高效检索"
    source_article: "B-09-vector-index-algorithms"
    difficulty: "simple"
    is_negative: false
  - question: "HNSW 中参数 m 和 ef_construct 分别控制什么？"
    expected_answer: "m 控制每层最大连接数（越大精度越高但内存越大），ef_construct 控制构建时搜索宽度（越大构建越慢但质量越高）"
