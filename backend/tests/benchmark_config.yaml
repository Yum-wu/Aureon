thresholds:
  retrieval:
    p50_ms: 200
    p99_ms: 1000
    recall_at_3: 0.90
    recall_at_5: 0.95
    recall_at_10: 0.97
    mrr: 0.80
    ndcg_at_10: 0.80
    qps_min: 5
  generation:
    p50_ms: 2000
    p99_ms: 5000
  quality:
    faithfulness: 0.70
    answer_relevancy: 0.75
    context_precision: 0.70
    context_recall: 0.75
    hallucination_max: 0.20
  cache:
    hit_rate_min: 0.6
    latency_ratio_max: 0.5
  smoke:
    health_timeout_s: 10
    rag_query_timeout_s: 30

endpoints:
  production: "https://aureon-production-659a.up.railway.app"
  local: "http://localhost:8000"

concurrency:
  levels: [1, 5, 10]
  queries_per_level: 20
